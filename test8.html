<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google</title>
    <link rel="icon" href="Google.jpeg">
    <link rel="stylesheet" href="style6.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" >
</head>
<body>
<!-- header -->
    <header class="top-bar">
    
    <!-- Links -->
        <div class="links">
            <a href="#">Gmail</a>
            <a href="#">Images</a>
        </div>
    <!-- end of Links -->
    
    <!-- Icons -->

        <div class="icons">
            <!-- <i class="fa-solid fa-grip" title="Google Apps"></i> -->
            <div class="profile">I</div>
        </div>
    <!-- end of Icons -->

    </header>
<!-- end of header -->



<!-- Container -->
    <div class="container">

    <!-- Logo -->

        <div class="logo">
            <img src="https://foxglove-partner.com/wp-content/uploads/2022/10/logo-google.png.webp" alt="Google Logo">
        </div>

    <!-- Search bar -->

        <div class="search-bar">
            <i class="fas fa-search"></i>
            <input type="text" placeholder="Demander à Google">
            
            <div class="search-icons">
                <img style="width: 17px" src="https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e8/Google_mic.svg/330px-Google_mic.svg.png?utm_source=commons.wikimedia.org&utm_campaign=index&utm_content=thumbnail" alt="Mic">
                <img style="width: 24px " src="https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/google-lens.svg" alt="Lens">
            </div>
        </div>
    <!-- + -->
        <div class="shortcut">
            <div class="circle">
                <i class="fas fa-plus"></i>
            </div>
            <p>Ajouter un raccourci</p>
        </div>
    </div>
<!-- end of Container -->

<!-- Footer -->
    <footer>
        <button  class="customize"> 
            <i class="fas fa-pen"></i>
            Personnaliser Chrome
        </button>
    </footer>
    
</body>
</html>
